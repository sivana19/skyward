<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skyward Ops | Flight Aggregator & Seat Lock</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .seat-held { animation: pulse-fast 1.5s infinite; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950/70 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-2xl">✈️</span>
        <span class="text-xl font-bold tracking-tight text-white">Skyward <span class="text-cyan-400 font-mono text-sm">v1.0-engine</span></span>
      </div>
      <div class="flex items-center gap-4 text-xs font-mono text-slate-400">
        <span class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Backend :8083 Online
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- Left Column: Search & Providers (7 Cols) -->
    <div class="lg:col-span-7 space-y-6">
      <!-- Search Form -->
      <section class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-6 shadow-xl">
        <h2 class="text-lg font-semibold mb-4 text-white">Parallel Fare Aggregator</h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="text-xs uppercase text-slate-400 font-medium">Origin</label>
            <input id="inputOrigin" type="text" value="ADD" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white font-mono uppercase focus:outline-none focus:border-cyan-400" />
          </div>
          <div>
            <label class="text-xs uppercase text-slate-400 font-medium">Destination</label>
            <input id="inputDest" type="text" value="DXB" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white font-mono uppercase focus:outline-none focus:border-cyan-400" />
          </div>
          <div class="flex items-end">
            <button onclick="searchFlights()" id="btnSearch" class="w-full bg-cyan-500 hover:bg-cyan-400 transition font-medium text-slate-950 py-2 rounded-lg text-sm shadow">
              Query Providers
            </button>
          </div>
        </div>
        <div id="searchMeta" class="mt-3 text-xs text-slate-400 font-mono"></div>
      </section>

      <!-- Results Grid -->
      <div id="resultsContainer" class="space-y-3">
        <!-- Rendered via JS -->
      </div>
    </div>

    <!-- Right Column: Interactive Cabin Seat Map (5 Cols) -->
    <div class="lg:col-span-5 space-y-6">
      <section class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-6 shadow-xl">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h2 class="text-lg font-semibold text-white">Cabin Seat Map</h2>
            <p class="text-xs text-slate-400 font-mono">Flight: <span class="text-cyan-400 font-bold" id="currentFlightLabel">ET-701</span></p>
          </div>
          <button onclick="refreshSeats()" class="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded text-slate-300">
            ↻ Sync
          </button>
        </div>

        <!-- Legend -->
        <div class="flex items-center gap-4 text-xs font-mono text-slate-400 mb-6 border-b border-slate-700 pb-4">
          <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-emerald-500/20 border border-emerald-500"></span> Open</div>
          <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-amber-500/20 border border-amber-500 seat-held"></span> Held</div>
          <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-rose-500/20 border border-rose-500"></span> Booked</div>
        </div>

        <!-- Cockpit Silhouette -->
        <div class="w-24 h-8 mx-auto border-t-2 border-x-2 border-slate-600 rounded-t-full mb-6"></div>

        <!-- Seats Grid -->
        <div id="seatGrid" class="grid grid-cols-2 gap-3 max-w-[240px] mx-auto mb-8">
          <!-- Rendered dynamically -->
        </div>

        <!-- Active Hold & Checkout Box -->
        <div id="checkoutBox" class="hidden bg-slate-900/80 border border-cyan-500/40 rounded-lg p-4 space-y-3">
          <div class="flex justify-between items-center">
            <span class="text-xs font-mono uppercase text-cyan-400">Lock Active: Seat <span id="lockedSeatLabel" class="font-bold"></span></span>
            <span id="countdownLabel" class="text-xs font-mono font-bold text-amber-400">30s remaining</span>
          </div>
          <p class="text-xs text-slate-400">Inventory reserved in memory. Complete purchase before lock releases automatically.</p>
          <button onclick="confirmSeat()" id="btnConfirm" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2 rounded text-xs transition">
            Finalize Ticket ($420.00)
          </button>
        </div>
      </section>
    </div>

  </main>

  <script>
    const API_BASE = "http://localhost:8083/api/v1";
    let activeHold = null;
    let countdownInterval = null;

    // 1. Search Aggregator
    async function searchFlights() {
      const origin = document.getElementById("inputOrigin").value.trim();
      const dest = document.getElementById("inputDest").value.trim();
      const meta = document.getElementById("searchMeta");
      const container = document.getElementById("resultsContainer");

      meta.textContent = "Querying 3 providers in parallel...";
      container.innerHTML = "";

      const start = performance.now();
      try {
        const res = await fetch(`${API_BASE}/flights/search?origin=${origin}&dest=${dest}`);
        const data = await res.json();
        const duration = (performance.now() - start).toFixed(0);

        meta.textContent = `Completed in ${duration}ms across ${data.count} airline backends`;

        container.innerHTML = data.offers.map(offer => `
          <div class="bg-slate-800/40 border border-slate-700/80 hover:border-slate-600 rounded-lg p-4 flex items-center justify-between transition">
            <div>
              <div class="text-sm font-semibold text-white">${offer.provider}</div>
              <div class="text-xs text-slate-400 font-mono mt-1">${offer.flight_no} • ${offer.origin} → ${offer.destination}</div>
            </div>
            <div class="text-right">
              <div class="text-lg font-bold font-mono text-cyan-400">$${offer.price_usd}</div>
              <div class="text-xs text-slate-500">Non-stop</div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        meta.textContent = "Error reaching Go API backend.";
      }
    }

    // 2. Fetch Seat States
    async function refreshSeats() {
      const grid = document.getElementById("seatGrid");
      try {
        const res = await fetch(`${API_BASE}/flights/ET-701/seats`);
        if (!res.ok) throw new Error();
        const data = await res.json();

        const seatKeys = Object.keys(data.seats || {}).sort();
        grid.innerHTML = seatKeys.map(key => {
          const seat = data.seats[key];
          let colorClass = "bg-emerald-500/10 border-emerald-500/50 text-emerald-300 hover:bg-emerald-500/20 cursor-pointer";
          let label = "Available";

          if (seat.status === "HELD") {
            colorClass = "bg-amber-500/10 border-amber-500/50 text-amber-300 seat-held cursor-not-allowed";
            label = "Held";
          } else if (seat.status === "CONFIRMED") {
            colorClass = "bg-rose-500/10 border-rose-500/50 text-rose-400 cursor-not-allowed opacity-60";
            label = "Booked";
          }

          return `
            <button onclick="handleSeatClick('${seat.seat_number}', '${seat.status}')" 
              class="border rounded-lg p-3 text-center transition flex flex-col items-center justify-center ${colorClass}">
              <span class="font-mono font-bold text-sm">${seat.seat_number}</span>
              <span class="text-[10px] uppercase font-mono mt-1">${label}</span>
            </button>
          `;
        }).join('');
      } catch (e) {
        grid.innerHTML = `<div class="col-span-2 text-center text-xs text-rose-400 font-mono">Failed loading seats from :8083</div>`;
      }
    }

    // 3. Hold Seat
    async function handleSeatClick(seatNo, status) {
      if (status !== "AVAILABLE") return;

      const customerId = "USER-" + Math.floor(1000 + Math.random() * 9000);
      try {
        const res = await fetch(`${API_BASE}/seats/hold`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            flight_id: "ET-701",
            seat_number: seatNo,
            customer_id: customerId
          })
        });

        const data = await res.json();
        if (!res.ok) {
          alert(data.message || "Seat hold failed");
          refreshSeats();
          return;
        }

        activeHold = { seatNo, customerId };
        startCheckout(seatNo, data.expires_at);
        refreshSeats();
      } catch (e) {
        alert("Failed to reach reservation engine");
      }
    }

    // 4. Timer Handling
    function startCheckout(seatNo, expiresAt) {
      document.getElementById("checkoutBox").classList.remove("hidden");
      document.getElementById("lockedSeatLabel").textContent = seatNo;

      if (countdownInterval) clearInterval(countdownInterval);

      const target = new Date(expiresAt).getTime();
      countdownInterval = setInterval(() => {
        const diff = Math.max(0, Math.floor((target - Date.now()) / 1000));
        document.getElementById("countdownLabel").textContent = `${diff}s remaining`;

        if (diff <= 0) {
          clearInterval(countdownInterval);
          document.getElementById("checkoutBox").classList.add("hidden");
          activeHold = null;
          refreshSeats();
        }
      }, 500);
    }

    // 5. Confirm Seat
    async function confirmSeat() {
      if (!activeHold) return;
      try {
        const res = await fetch(`${API_BASE}/seats/confirm`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            flight_id: "ET-701",
            seat_number: activeHold.seatNo,
            customer_id: activeHold.customerId
          })
        });

        const data = await res.json();
        if (!res.ok) {
          alert(data.message || "Failed to confirm seat");
        } else {
          alert(`🎉 ${data.message} Seat ${data.seat_number} is locked in!`);
          document.getElementById("checkoutBox").classList.add("hidden");
          clearInterval(countdownInterval);
          activeHold = null;
        }
        refreshSeats();
      } catch (e) {
        alert("Confirmation failed");
      }
    }

    // Initial Load
    searchFlights();
    refreshSeats();
    // Auto-poll seats every 3 seconds to reflect background worker releases
    setInterval(refreshSeats, 3000);
  </script>
</body>
</html>
